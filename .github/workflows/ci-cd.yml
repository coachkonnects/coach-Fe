name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: NITRO_PRESET=node-server npm run build

      - name: Clear old deployment on EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Clearing old deployment ---"
            rm -rf /home/ubuntu/frontend/.output

      - name: Copy built output to EC2
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".output"
          target: "/home/ubuntu/frontend/"

      - name: Restart Frontend Service on EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Restarting the frontend service ---"
            sudo systemctl restart coachkonnects-frontend

            echo "--- Waiting for service to start ---"
            sleep 5

            echo "--- Checking service status ---"
            sudo systemctl status coachkonnects-frontend --no-pager

            echo "--- Frontend Deployment Complete! ---"
